name: DeepSeek Harness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deepseek-harness.yml'
      - 'integrations/deepseek-harness/**'
      - 'scripts/**'
      - 'SKILL.md'
      - 'references/detection-rules.md'
      - 'LICENSE'
      - 'tests/fixtures/safe-skill/**'
      - 'tests/fixtures/high-risk-skill/**'
  pull_request:
    paths:
      - '.github/workflows/deepseek-harness.yml'
      - 'integrations/deepseek-harness/**'
      - 'scripts/**'
      - 'SKILL.md'
      - 'references/detection-rules.md'
      - 'LICENSE'
      - 'tests/fixtures/safe-skill/**'
      - 'tests/fixtures/high-risk-skill/**'

permissions:
  contents: read

jobs:
  deepseek-harness-bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22.19.0", "24"]

    defaults:
      run:
        working-directory: integrations/deepseek-harness

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: integrations/deepseek-harness/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Bundle dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Bundle
        run: pnpm verify

      - name: Pack release candidate
        run: pnpm pack --pack-destination .pack

  deepseek-harness-e2e:
    name: DSH E2E (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "22.19.0"
          - os: windows-latest
            node-version: "24"

    defaults:
      run:
        working-directory: integrations/deepseek-harness

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: integrations/deepseek-harness/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Bundle dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack Bundle under test
        run: pnpm pack --pack-destination .pack

      - name: Install isolated DeepSeek Harness runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "dsh-runtime"
          New-Item -ItemType Directory $runtimeRoot | Out-Null
          Copy-Item e2e-runtime/package.json,e2e-runtime/pnpm-workspace.yaml,e2e-runtime/pnpm-lock.yaml $runtimeRoot
          pnpm --dir $runtimeRoot install --frozen-lockfile

      - name: Run deterministic headless Skill E2E
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP "dsh-runtime"
          $packages = @(Get-ChildItem .pack -File -Filter "dsh-skill-security-guard-*.tgz")
          if ($packages.Count -ne 1) { throw "Expected one tarball, found $($packages.Count)" }
          $tarball = $packages[0].FullName
          $pythonExecutable = python -c "import sys; print(sys.executable)"
          $env:DSH_ENTRY = Join-Path $runtimeRoot "node_modules/@deepseek-ai/dsh/lib/bin.js"
          $env:DSH_TARBALL = $tarball
          $env:DSH_E2E_ROOT = Join-Path $env:RUNNER_TEMP "dsh-skill-security-guard-e2e"
          $env:PYTHON_EXECUTABLE = $pythonExecutable
          $env:DSH_E2E_PERMISSION_MODE = "danger-full-access"
          pnpm test:e2e:dsh
