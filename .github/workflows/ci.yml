name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: Core and schemas (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run scanner suite without site packages
        run: python -S -m unittest discover -s tests -p "test_*.py" -v
      - name: Scan the repository skill
        run: python -S scripts/scan.py .
      - name: Install CI-only JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate CLI reports against both Draft 2020-12 schemas
        run: python tests/validate_schemas.py
